<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PULSE NEWS — إدارة البوت الإخباري</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060d14;--pn:#0d1a26;--bd:#1d354c;--ac:#2ee59d;--ac2:#12b57a;--warn:#f5b942;--bad:#ff6b6b;--tx:#eef7ff;--mu:#8aa9c4}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(600px 280px at 50% 0,rgba(46,229,157,.12),transparent 70%),var(--bg);color:var(--tx);font:15px/1.5 'Cairo','Sora',sans-serif;min-height:100vh;padding:14px 14px 86px}
.wrap{max-width:520px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand h1{font-size:20px;font-weight:800;color:var(--ac)}
.brand small{color:var(--mu);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--pn);font-size:12.5px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.pill.off .dot{background:var(--warn);box-shadow:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--ac)}
.stat small{color:var(--mu);font-size:11.5px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:15.5px;font-weight:800;margin-bottom:8px}
.row{display:flex;gap:8px}
button{font:700 14px 'Cairo','Sora',sans-serif;border:0;border-radius:12px;padding:11px 14px;cursor:pointer;transition:.15s}
button:active{transform:scale(.99)}
.btn-on{flex:1;background:linear-gradient(180deg,#3cf0aa,var(--ac2));color:#04160f}
.btn-off{flex:1;background:rgba(255,107,107,.14);color:#ff9b9b;border:1px solid rgba(255,107,107,.35)}
.btn-sec{background:rgba(46,229,157,.12);color:var(--ac);border:1px solid var(--bd)}
.btn-add{background:var(--ac);color:#04160f;padding:0 16px}
input,select,textarea{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font:13.5px/1.45 'Cairo','Sora',sans-serif;padding:10px 12px;outline:none}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.025);border:1px solid rgba(29,53,76,.7);border-radius:12px;padding:8px 11px;font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(46,229,157,.12);color:var(--ac)}
.prices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.pbox{background:rgba(0,0,0,.25);border:1px solid rgba(29,53,76,.7);border-radius:12px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center}
.up{color:var(--ac);font-weight:700;font-size:12.5px}
.dn{color:var(--bad);font-weight:700;font-size:12.5px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(6,13,20,.95);border-top:1px solid var(--bd);display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0))}
.tabs button{flex:1;background:none;color:var(--mu);padding:8px 4px;font-size:12.5px}
.tabs button.on{background:rgba(46,229,157,.14);color:var(--ac)}
.pane{display:none}.pane.on{display:block}
#toast{position:fixed;bottom:74px;left:14px;right:14px;max-width:492px;margin:0 auto;background:#122b3d;border:1px solid var(--ac);color:var(--tx);padding:10px 14px;border-radius:12px;font-size:13px;display:none;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="brand">
      <h1>PULSE NEWS</h1>
      <small>أخبار وأحداث الكريبتو والأسواق · عربي / إنجليزي</small>
    </div>
    <div class="pill" id="statusPill"><span class="dot"></span><span id="statusText">يعمل</span></div>
  </header>

  <div class="grid3">
    <div class="stat"><b id="pubCount">0</b><small>منشور أُرسل</small></div>
    <div class="stat"><b id="srcCount">0</b><small>مصدر نشط</small></div>
    <div class="stat"><b id="tgtCount">0</b><small>قناة نشر</small></div>
  </div>

  <section class="pane on" id="p-control">
    <div class="card">
      <h2>التشغيل والإيقاف</h2>
      <div class="row">
        <button class="btn-on" id="btnOn">▶ تشغيل البوت</button>
        <button class="btn-off" id="btnOff">⏸ إيقاف البوت</button>
      </div>
      <button class="btn-sec" id="btnFetch" style="width:100%;margin-top:8px">⚡ جلب ونشر الأخبار والأسعار الآن</button>
    </div>

    <div class="card">
      <h2>ماكيت / قالب النشر (ضع {{NEWS}} مكان الخبر)</h2>
      <textarea id="tplInput"></textarea>
      <button class="btn-on" id="btnSaveTpl" style="width:100%;margin-top:8px">💾 حفظ القالب</button>
    </div>
  </section>

  <section class="pane" id="p-sources">
    <div class="card">
      <h2>إضافة مصدر أخبار أو قناة تليجرام أو X</h2>
      <div class="row">
        <select id="srcType" style="max-width:140px">
          <option value="tg_channel">قناة تليجرام</option>
          <option value="x_feed">تغذية X / تويتر</option>
          <option value="rss">موقع أخبار (RSS)</option>
        </select>
        <input id="srcVal" placeholder="@WatcherGuru أو رابط RSS / X">
        <button class="btn-add" id="btnAddSrc">إضافة</button>
      </div>
      <div class="list" id="srcList"></div>
    </div>
  </section>

  <section class="pane" id="p-market">
    <div class="card">
      <h2>قنوات النشر (عيّن البوت أدمن فيها)</h2>
      <div class="row">
        <input id="tgtVal" placeholder="@YourChannel أو -100123456789">
        <button class="btn-add" id="btnAddTgt">إضافة قناة</button>
      </div>
      <div class="list" id="tgtList"></div>
    </div>

    <div class="card">
      <h2>حركة العملات الرقمية الموثوقة (24h)</h2>
      <div class="prices" id="priceBox"></div>
    </div>
  </section>
</div>

<div id="toast"></div>

<nav class="tabs">
  <button class="on" data-p="control">التحكم والقالب</button>
  <button data-p="sources">المصادر</button>
  <button data-p="market">القنوات والأسعار</button>
</nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);

function notify(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._tt);
  window._tt = setTimeout(() => { t.style.display = 'none'; }, 3000);
}

async function api(path, body) {
  const r = await fetch('/api' + path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

function render(s) {
  $('pubCount').textContent = s.publishedCount || 0;
  $('srcCount').textContent = (s.sources || []).length;
  $('tgtCount').textContent = (s.targets || []).length;
  $('statusText').textContent = s.running ? 'يعمل تلقائياً' : 'متوقف';
  $('statusPill').classList.toggle('off', !s.running);
  if (document.activeElement !== $('tplInput')) $('tplInput').value = s.template || '';

  $('srcList').innerHTML = (s.sources || []).map(x =>
    `<div class="item"><span>${x.value}</span><span class="tag">${x.type}</span></div>`
  ).join('') || '<small>لا توجد مصادر بعد</small>';

  $('tgtList').innerHTML = (s.targets || []).map(x =>
    `<div class="item"><span>${x.chat_id}</span><span class="tag">نشر نشط</span></div>`
  ).join('') || '<small>أضف قناة نشر واحدة على الأقل</small>';

  $('priceBox').innerHTML = (s.prices || []).map(p => {
    const ch = Number(p.change24h || 0);
    const cls = ch >= 0 ? 'up' : 'dn';
    const sgn = ch >= 0 ? '+' : '';
    return `<div class="pbox"><div><b>${p.symbol}</b><br><small>$${Number(p.price || 0).toLocaleString('en-US', { maximumFractionDigits: 4 })}</small></div><span class="${cls}">${sgn}${ch.toFixed(2)}%</span></div>`;
  }).join('') || '<small>سيتم تحديث الأسعار في دورة الجلب التالية</small>';
}

async function load() { render(await api('/state')); }

$('btnOn').onclick = async () => { await api('/toggle', { running: true }); notify('تم تشغيل البوت'); load(); };
$('btnOff').onclick = async () => { await api('/toggle', { running: false }); notify('تم إيقاف البوت'); load(); };
$('btnSaveTpl').onclick = async () => { await api('/template', { template: $('tplInput').value }); notify('تم حفظ القالب'); load(); };
$('btnAddSrc').onclick = async () => {
  await api('/sources', { type: $('srcType').value, value: $('srcVal').value });
  $('srcVal').value = '';
  notify('تمت إضافة المصدر');
  load();
};
$('btnAddTgt').onclick = async () => {
  await api('/targets', { chat_id: $('tgtVal').value });
  $('tgtVal').value = '';
  notify('تمت إضافة قناة النشر');
  load();
};
$('btnFetch').onclick = async () => {
  const res = await api('/fetch-now', {});
  notify(`تم الجلب · منشورات جديدة: ${res.published || 0}`);
  load();
};

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button, .pane').forEach(el => el.classList.remove('on'));
    btn.classList.add('on');
    $('p-' + btn.dataset.p).classList.add('on');
  };
});

load();
setInterval(load, 15000);
</script>
</body>
</html>
